<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Mohammed Adil — Flutter Developer</title>
<desc>Animated banner: name, role, cycling technology list, and headline stats.</desc>
<defs>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#F5F5F7"/>
<stop offset="42%" stop-color="#F5F5F7"/>
<stop offset="50%" stop-color="#54C5F8"/>
<stop offset="58%" stop-color="#F5F5F7"/>
<stop offset="100%" stop-color="#F5F5F7"/>
<animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="4.5s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#54C5F8"/>
<stop offset="100%" stop-color="#027DFD" stop-opacity="0"/>
</linearGradient>
</defs>
<style>
.bg{fill:#0c0c0f}
.nm{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:66px;font-weight:600;fill:url(#shine)}
.sub{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:22px;fill:#8B8B96}
.rot{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:20px;fill:#54C5F8;opacity:0}
.num{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:42px;font-weight:500;fill:#F5F5F7}
.lbl{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:17px;fill:#8B8B96}
.dot{fill:#54C5F8;opacity:.18}
.rule{stroke:url(#edge);stroke-width:3;stroke-dasharray:350;stroke-dashoffset:350;animation:draw 2.2s ease-out .4s forwards}
.div{stroke:#26262e;stroke-width:1}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes cyc{0%,3%{opacity:0}7%,22%{opacity:1}26%,100%{opacity:0}}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.r1{animation:cyc 13s linear infinite}
.r2{animation:cyc 13s linear 3.25s infinite}
.r3{animation:cyc 13s linear 6.5s infinite}
.r4{animation:cyc 13s linear 9.75s infinite}
.d1{animation:drift 6s ease-in-out infinite}
.d2{animation:drift 7.5s ease-in-out .8s infinite}
.d3{animation:drift 5.5s ease-in-out 1.6s infinite}
.d4{animation:drift 8s ease-in-out .4s infinite}
.d5{animation:drift 6.8s ease-in-out 2.2s infinite}
.d6{animation:drift 7.2s ease-in-out 1.2s infinite}
.s1{opacity:0;animation:rise .7s ease-out .9s forwards}
.s2{opacity:0;animation:rise .7s ease-out 1.1s forwards}
.s3{opacity:0;animation:rise .7s ease-out 1.3s forwards}
</style>
<rect class="bg" x="0" y="0" width="1200" height="300" rx="16"/>
<circle class="dot d1" cx="1082" cy="52" r="4"/>
<circle class="dot d2" cx="1148" cy="228" r="3"/>
<circle class="dot d3" cx="742" cy="44" r="3.5"/>
<circle class="dot d4" cx="1012" cy="262" r="3"/>
<circle class="dot d5" cx="806" cy="258" r="4"/>
<circle class="dot d6" cx="928" cy="38" r="2.5"/>
<text class="nm" x="70" y="132">Mohammed Adil</text>
<line class="rule" x1="70" y1="158" x2="420" y2="158"/>
<text class="sub" x="70" y="198">Flutter Developer · Dubai, UAE</text>
<text class="rot r1" x="70" y="240">Clean Architecture · BLoC · Cubit</text>
<text class="rot r2" x="70" y="240">Dio · GetIt · Firebase</text>
<text class="rot r3" x="70" y="240">.NET Core Web APIs in C#</text>
<text class="rot r4" x="70" y="240">CI/CD to TestFlight and Play Console</text>
<line class="div" x1="920" y1="108" x2="920" y2="188"/>
<line class="div" x1="1050" y1="108" x2="1050" y2="188"/>
<g class="s1">
<text class="num" x="855" y="152" text-anchor="middle">6</text>
<text class="lbl" x="855" y="182" text-anchor="middle">apps live</text>
</g>
<g class="s2">
<text class="num" x="985" y="152" text-anchor="middle">3+</text>
<text class="lbl" x="985" y="182" text-anchor="middle">years</text>
</g>
<g class="s3">
<text class="num" x="1115" y="152" text-anchor="middle">4</text>
<text class="lbl" x="1115" y="182" text-anchor="middle">companies</text>
</g>
</svg>
